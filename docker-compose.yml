services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=file:///app/mlruns

  mlflow:
    build: .
    entrypoint: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
                 "--backend-store-uri", "file:///app/mlruns"]
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    profiles:
      - mlflow
